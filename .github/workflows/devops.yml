name: Validate FoodMatrix deployment

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/devops.yml"
      - ".github/workflows/publish-images.yml"
      - "backend/**"
      - "frontend/**"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/devops.yml"
      - ".github/workflows/publish-images.yml"
      - "backend/**"
      - "frontend/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: terraform -chdir=deploy/terraform fmt -check
      - run: terraform -chdir=deploy/terraform init -backend=false -input=false
      - run: terraform -chdir=deploy/terraform validate
      - run: bash deploy/scripts/validate-helm.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [frontend, kong, organization-service, hr-service, catalog-service, order-service, inventory-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: bash deploy/scripts/build-image.sh "${{ matrix.image }}" "foodmatrix/${{ matrix.image }}:${GITHUB_SHA}"
