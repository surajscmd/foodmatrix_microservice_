name: Publish FoodMatrix images

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: image-publish
    strategy:
      fail-fast: false
      matrix:
        image: [frontend, kong, organization-service, hr-service, catalog-service, order-service, inventory-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable image
        env:
          IMAGE: ${{ matrix.image }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}/foodmatrix
        run: |
          if aws ecr describe-images --repository-name "foodmatrix/$IMAGE" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image already published for $GITHUB_SHA"
            exit 0
          fi
          bash deploy/scripts/build-image.sh "$IMAGE" "$REGISTRY/$IMAGE:$GITHUB_SHA" --push
