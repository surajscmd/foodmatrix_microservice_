          - /api/notification
        strip_path: true

# ==============================================================
# GLOBAL PLUGINS
# ==============================================================

plugins:
  # ------------------------------------------------------------
  # CORS
  # ------------------------------------------------------------

  - name: cors
    config:
      origins:
        - http://localhost:3000

      methods:
        - GET
        - HEAD
        - PUT
        - PATCH
        - POST
        - DELETE
        - OPTIONS

      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Requested-With

      exposed_headers:
        - Kong-Request-ID

      credentials: true
      max_age: 3600
      preflight_continue: false

  # ------------------------------------------------------------
  # CORRELATION ID
  # ------------------------------------------------------------

  - name: correlation-id
    config:
      header_name: Kong-Request-ID
      generator: uuid
      echo_downstream: true

  # ------------------------------------------------------------
  # RATE LIMITING
  # ------------------------------------------------------------

  - name: rate-limiting
    config:
      minute: 60
      policy: local
      limit_by: ip
      fault_tolerant: true

  # ------------------------------------------------------------
  # REQUEST SIZE LIMIT
  # ------------------------------------------------------------

  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes

  # ------------------------------------------------------------
  # PROMETHEUS METRICS
  # ------------------------------------------------------------

  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
