    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 1

    routes:
      - name: inventory-route
        paths:
          - /api/inventory
        strip_path: true

  # ============================================================
  # NOTIFICATION SERVICE
  # ============================================================

  - name: notification-service
    url: http://host.docker.internal:3007

    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 1

    routes:
      - name: notification-route
