_format_version: "3.0"

services:
  # ============================================================
  # ORGANIZATION SERVICE
  # ============================================================

  - name: organization-service
    url: http://host.docker.internal:3001

    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 1

    routes:
      - name: organization-route
        paths:
          - /api/organization
        strip_path: true

  # ============================================================
  # AUTH SERVICE
  # ============================================================

  - name: auth-service
    url: http://host.docker.internal:3001

    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 1

    routes:
      - name: auth-route
        paths:
          - /api/auth
        strip_path: false

  # ============================================================
  # HR SERVICE
  # ============================================================

  - name: hr-service
    url: http://host.docker.internal:3002

    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
