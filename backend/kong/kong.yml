    routes:
      - name: catalog-route
        paths:
          - /api/catalog
        strip_path: true

  # ============================================================
  # ORDER SERVICE
  # ============================================================

  - name: order-service
    url: http://host.docker.internal:3005

    connect_timeout: 5000
