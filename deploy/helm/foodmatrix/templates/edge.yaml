apiVersion: v1
kind: ConfigMap
metadata:
  name: foodmatrix-edge
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }
    server {
      listen 8080;
      client_max_body_size 20m;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto {{ .Values.edge.forwardedProto }};
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      location = /edge-health {
        access_log off;
        return 200 'ok';
      }
      location /api/notification/socket.io {
        proxy_pass http://notification-service:3007/socket.io;
        proxy_read_timeout 120s;
      }
      location ^~ /api/auth/reset-password/ {
        access_log off;
        limit_except GET { deny all; }
        proxy_pass http://kong:8000;
      }
      location / {
        proxy_pass http://frontend:3000;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: foodmatrix-edge
  {{- with .Values.edge.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.edge.serviceType }}
  {{- with .Values.edge.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  selector:
    app.kubernetes.io/name: foodmatrix-edge
  ports:
    - name: web
      port: {{ if eq .Values.edge.forwardedProto "https" }}443{{ else }}80{{ end }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodmatrix-edge
spec:
  replicas: {{ .Values.edge.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: foodmatrix-edge
  template:
    metadata:
      annotations:
        checksum/config: {{ printf "%v" .Values.edge | sha256sum }}
      labels:
        app.kubernetes.io/name: foodmatrix-edge
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: {{ .Values.edge.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /edge-health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: foodmatrix-edge
