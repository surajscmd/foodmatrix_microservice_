publicOrigin: "https://matrix.example.com"
postgresCaConfigMap: foodmatrix-rds-ca
edge:
  replicas: 2
  serviceType: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  forwardedProto: https
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "replace-with-acm-certificate-arn"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
observability:
  enabled: true
  kongServiceMonitor: true
kafkaSecret: foodmatrix-kafka
