# Container development stack. Requires each backend/.env.docker and external PostgreSQL.
# Back up existing Kafka broker data before switching to the new named volumes.
include:
  - backend/kafka/docker-compose.yml

services:
  organization-service:
    build:
      context: .
      dockerfile: deploy/images/backend.Dockerfile
      args:
        SERVICE: organization-service
        PRISMA_CONFIG: prisma.config.ts
    env_file:
      - ./backend/organization-service/.env.docker
    environment:
      PORT: "3001"
      ORGANIZATION_SERVICE_URL: http://organization-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3004
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
    networks: [default, kafka-network]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: deploy/images/backend.Dockerfile
      args:
        SERVICE: catalog-service
        PRISMA_CONFIG: prisma.config.ts
    env_file:
      - ./backend/catalog-service/.env.docker
    environment:
      PORT: "3004"
      ORGANIZATION_SERVICE_URL: http://organization-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3004
    networks: [default, kafka-network]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health/ready', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  hr-service:
    build:
      context: .
      dockerfile: deploy/images/backend.Dockerfile
      args:
        SERVICE: hr-service
        PRISMA_CONFIG: prisma.config.ts
    env_file:
      - ./backend/hr-service/.env.docker
    environment:
      PORT: "3002"
      ORGANIZATION_SERVICE_URL: http://organization-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3004
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    networks: [default, kafka-network]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health/ready', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: deploy/images/backend.Dockerfile
      args:
        SERVICE: order-service
        PRISMA_CONFIG: prisma.config.ts
    env_file:
      - ./backend/order-service/.env.docker
    environment:
      PORT: "3005"
      ORGANIZATION_SERVICE_URL: http://organization-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3004
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    networks: [default, kafka-network]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/health/ready', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: deploy/images/backend.Dockerfile
      args:
        SERVICE: inventory-service
        PRISMA_CONFIG: prisma7.config.ts
    env_file:
      - ./backend/inventory-service/.env.docker
    environment:
      PORT: "3006"
      ORGANIZATION_SERVICE_URL: http://organization-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3004
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    networks: [default, kafka-network]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3006/health/ready', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: deploy/images/backend.Dockerfile
      args:
        SERVICE: notification-service
        PRISMA_CONFIG: prisma7.config.ts
    env_file:
      - ./backend/notification-service/.env.docker
    environment:
      PORT: "3007"
      ORGANIZATION_SERVICE_URL: http://organization-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3004
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    networks: [default, kafka-network]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3007/health/ready', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/images/frontend.Dockerfile
    environment:
      FOODMATRIX_API_URL: http://kong:8000
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      organization-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  edge:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - ./deploy/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      kong:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    restart: unless-stopped

  kong:
    build:
      context: .
      dockerfile: deploy/images/kong.Dockerfile
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_STATUS_LISTEN: 0.0.0.0:8100
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
