services:

  catalog-service:
    build:
      context: ./backend/catalog-service
      dockerfile: Dockerfile
    container_name: matrix-catalog-service
    ports:
      - "3002:3002"
    env_file:
      - ./backend/catalog-service/.env.docker
    restart: unless-stopped

  hr-service:
    build:
      context: ./backend/hr-service
      dockerfile: Dockerfile
    container_name: matrix-hr-service
    ports:
      - "3003:3003"
    env_file:
      - ./backend/hr-service/.env.docker
    restart: unless-stopped

  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: matrix-order-service
    ports:
      - "3005:3005"
    env_file:
      - ./backend/order-service/.env.docker
    restart: unless-stopped

  organization-service:
    build:
      context: ./backend/organization-service
      dockerfile: Dockerfile
    container_name: matrix-organization-service
    ports:
      - "3001:3001"
    env_file:
      - ./backend/organization-service/.env.docker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matrix-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped